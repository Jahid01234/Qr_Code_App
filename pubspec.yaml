name: qr_code_app
description: "Qr code generate and scanner Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_contacts: ^1.1.9+2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0



flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/


